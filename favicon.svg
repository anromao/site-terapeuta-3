<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Fundo Cósmico -->
  <circle cx="24" cy="24" r="22" fill="#0C0614" stroke="url(#logo-border)" stroke-width="1.5"/>
  <!-- Anéis Orbitais Cósmicos como na imagem de referência -->
  <ellipse cx="24" cy="24" rx="20" ry="7" stroke="url(#logo-orbit)" stroke-width="1.2" transform="rotate(-30 24 24)"/>
  <!-- Lótus e Estrela Central -->
  <path d="M24 11C24 11 16 18 16 25C16 29.4183 19.5817 33 24 33C28.4183 33 32 29.4183 32 25C32 18 24 11 24 11Z" fill="url(#logo-lotus)" fill-opacity="0.9"/>
  <!-- Estrela de 4 pontas no centro -->
  <path d="M24 21L25.5 24L28.5 25.5L25.5 27L24 30L22.5 27L19.5 25.5L22.5 24Z" fill="#FFFFFF"/>
  <circle cx="24" cy="25.5" r="1.5" fill="#FFE4E6"/>
  <!-- Partículas estelares -->
  <circle cx="12" cy="16" r="1" fill="#FF7597"/>
  <circle cx="36" cy="32" r="1" fill="#E0B0FF"/>
  <defs>
    <linearGradient id="logo-border" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D12845"/>
      <stop offset="0.5" stop-color="#A83279"/>
      <stop offset="1" stop-color="#8E24AA"/>
    </linearGradient>
    <linearGradient id="logo-orbit" x1="4" y1="17" x2="44" y2="31" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF7597" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#8E24AA" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#D12845" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="logo-lotus" x1="16" y1="11" x2="32" y2="33" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF7597"/>
      <stop offset="0.5" stop-color="#D12845"/>
      <stop offset="1" stop-color="#8E24AA"/>
    </linearGradient>
  </defs>
</svg>
